name: PropertyLeads schedule

# Active Mon-Fri 10 AM - 6 PM Central. Off nights, weekends, and US federal holidays.
# Runs every hour. Each run checks the time and sets the status to match,
# so if PropertyLeads ever turns itself back on, the next run turns it off.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:       # lets you run it by hand from the Actions tab
    inputs:
      action:
        description: "auto = follow the schedule, or force stop/start"
        required: true
        default: auto
        type: choice
        options: [auto, stop, start]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install playwright holidays
          python -m playwright install --with-deps chromium

      - name: Set status
        env:
          PL_EMAIL: ${{ secrets.PL_EMAIL }}
          PL_PASSWORD: ${{ secrets.PL_PASSWORD }}
        run: python propertyleads/toggle_status.py ${{ inputs.action || 'auto' }}
